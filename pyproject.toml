[project]
name = "smart-meter-peak-prediction"
version = "0.1.0"
description = "Household-level consumption peak prediction on a Databricks lakehouse, with streaming ingestion and governed ML features"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "pre-commit>=3.7",
    "pyyaml>=6",       # scripts/check_specs.py validates data contracts
    "pandas>=2.2",     # scripts/profile_data.py, sampling and their tests
    "pyspark>=3.5,<4.1",  # local Spark for the library and pipeline-harness unit tests
    # PEAK_MODEL unit tests (ADR 0007: the platform keeps scikit-learn 1.3.0; Python 3.12 has
    # 1.3.2 as the closest wheel, which is why the platform pin lives in peak_config, not here)
    "scikit-learn>=1.3,<1.4",
    "numpy<2",            # scikit-learn 1.3 needs NumPy 1 (matches the serverless stack)
    "mlflow-skinny>=2.16,<4",  # pyfunc wrapper round trip; serverless has 3.17.2
    "pyarrow>=15,<22",    # parquet artifacts; pyarrow 22+ requires NumPy 2
]
sample = [
    "pandas>=2.2",     # src/smart_meter_peak_prediction/sampling.py
]
producer = [
    "confluent-kafka>=2.4",  # src/smart_meter_peak_prediction/producer.py
]
integration = [
    "databricks-sdk>=0.30",  # tests/integration against the dev workspace
    "mlflow-skinny>=2.16,<4",  # PEAK_MODEL integration tests read runs and the registry
    "pyarrow>=15,<22",
]
profile = [
    "pandas>=2.2",
    "pyarrow>=15",     # Parquet input
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts"]
markers = [
    "integration: needs a live environment (cloud workspace, broker); skipped in CI",
    "local_data: needs the Kaggle raw files in data/raw; skipped in CI",
]
addopts = "-m 'not integration and not local_data'"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["spikes", ".claude"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "PT"]
ignore = ["S101"]  # assert is how tests and spikes check outcomes

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["S603", "S607"]  # trusted local scripts call git and subprocesses
"src/smart_meter_peak_prediction/metrics.py" = ["S608"]  # SQL builders over trusted table names
"src/smart_meter_peak_prediction/gold.py" = ["S608"]     # SQL text built from validated settings
"src/smart_meter_peak_prediction/delta_sync.py" = ["S608"]  # SQL from validated settings
"src/smart_meter_peak_prediction/features.py" = ["S608"]    # SQL from validated settings
"src/smart_meter_peak_prediction/labels.py" = ["S608"]      # SQL from validated settings
"tests/integration/*" = ["S608"]  # SQL over table names from Settings, run on the dev workspace
"**/notebooks/*" = ["F821"]       # Databricks notebooks get spark and dbutils at runtime
"**/pipelines/*" = ["F821"]       # pipeline sources get spark at runtime
