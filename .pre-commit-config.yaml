# Pinned revisions age; run `pre-commit autoupdate` after creating a project.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: detect-private-key
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: check-specs
        name: SDD spec gates
        entry: python scripts/check_specs.py
        language: python
        additional_dependencies: [pyyaml>=6]
        pass_filenames: false
        files: ^(\.claude/sdd/|docs/adr/|docs/contracts/)
