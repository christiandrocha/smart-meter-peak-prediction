# Data contract: evaluation table behind Silver and the quarantine. An ops dataset: not an input of PEAK_MODEL.
# Defined in .claude/sdd/features/DESIGN_METER_INGESTION.md (Data Model, OD-02, DA-01 fallback, manifest 30a).
dataset: smart_meter_dev.silver.meter_readings_evaluated
kind: table
object_type: materialized view recomputed over bronze.files_meter_readings and bronze.kafka_meter_readings
owner: METER_INGESTION
audience: ops (data platform operator and reconciliation tests); not for PEAK_MODEL
description: Every Bronze reading row, parsed once, with the drop rules it failed, its scope flag and its deduplication ranks (valid rows and dropped rows). Silver, the quarantine and the rule, scope and duplicate counts are all derived from it.
grain: one row per Bronze reading row (files and Kafka)
primary_key: [_source_ref]
freshness:
  expected_latency: 24h
  schedule: daily
schema:
  - name: _source_ref
    type: string
    nullable: false
    description: Identifier of the Bronze row, same definition as in silver.meter_readings; unique (INV-01).
  - name: _ingestion_path
    type: string
    nullable: false
    description: files or kafka.
  - name: _ingested_at
    type: timestamp
    nullable: false
    description: Bronze ingestion time in UTC, copied from Bronze (processing time, never event time).
  - name: household_id
    type: string
    nullable: true
    description: Trimmed household identifier; null for a Kafka row whose payload does not parse.
  - name: household_id_raw
    type: string
    nullable: true
    description: Household identifier as received (Bronze value for files, JSON field for Kafka).
  - name: reading_ts_raw
    type: string
    nullable: true
    description: Raw timestamp text as received.
  - name: energy_kwh_raw
    type: string
    nullable: true
    description: Raw energy text as received.
  - name: reading_ts
    type: timestamp
    nullable: true
    description: Event time in UTC; null when the raw timestamp does not parse or the payload is invalid.
  - name: energy_kwh
    type: double
    nullable: true
    description: Energy in kWh over the half hour; null when the trimmed raw value does not parse.
  - name: reading_date
    type: date
    nullable: true
    description: UTC calendar date of reading_ts.
  - name: _produced_at
    type: timestamp
    nullable: true
    description: Producer wall clock in UTC parsed from the Kafka payload (processing time); null for file rows.
  - name: payload
    type: string
    nullable: true
    description: Raw Kafka message value; null for the file path.
  - name: _rescued_data
    type: string
    nullable: true
    description: Auto Loader rescued data of the file row; null for Kafka rows.
  - name: payload_ok
    type: boolean
    nullable: false
    description: True for file rows; for Kafka rows true when the payload parses with the topic value schema and its required fields are present.
  - name: failed_rules
    type: array<string>
    nullable: false
    description: Every drop rule the row failed (QR-07, QR-02, QR-03, QR-04, QR-05) in precedence order; empty when none.
  - name: rule_name
    type: string
    nullable: true
    description: First element of failed_rules; null when the row failed no drop rule.
  - name: is_out_of_scope
    type: boolean
    nullable: false
    description: True when reading_ts is outside the study period (SF-01, a scope transformation, not a quality rule).
  - name: _dedup_key
    type: string
    nullable: false
    description: "Content identity of the row for deduplicating dropped rows, prefixed by the ingestion path (kafka:key: whenever the raw household_id and reading_ts are readable, otherwise kafka:payload:; files:key:, files:row:; see silver_meter_readings_quarantine.yaml). Computed for every row, used only for rows that failed a drop rule."
  - name: dedup_rank
    type: int
    nullable: true
    description: row_number() over (household_id, reading_ts) ordered by _ingested_at, _source_ref among rows that failed no rule and are in scope; null for other rows.
  - name: quarantine_rank
    type: int
    nullable: true
    description: row_number() over _dedup_key ordered by _ingested_at, _source_ref among rows with a non-empty failed_rules; null for other rows.
  - name: is_quarantine_duplicate
    type: boolean
    nullable: false
    description: True for a dropped row with quarantine_rank > 1 (QR-09 b); it is left out of the quarantine and of every per-rule total.
  - name: is_quarantined
    type: boolean
    nullable: false
    description: True for a dropped row with quarantine_rank = 1; these rows are silver.meter_readings_quarantine.
  - name: is_duplicate
    type: boolean
    nullable: false
    description: True for a candidate row with dedup_rank > 1, or a dropped row that is_quarantine_duplicate (QR-09, first ingested wins); the QR-09 table total.
  - name: is_silver
    type: boolean
    nullable: false
    description: True for a candidate row with dedup_rank = 1; these rows are silver.meter_readings.
  - name: source_ref_row_count
    type: int
    nullable: false
    description: Number of evaluated rows with the same _source_ref (INV-01, must be 1).
quality:
  - id: QR-01
    rule: "NOT payload_ok OR (household_id IS NOT NULL AND household_id RLIKE '^MAC[0-9]{6}$')"
    action: fail
  - id: QR-06
    rule: "files rows are before the cutoff and Kafka rows at or after it (default cutoff 2013-12-01T00:00:00Z)"
    action: fail
  - id: INV-01
    rule: "source_ref_row_count = 1"
    action: fail
  - id: QR-08
    rule: "_rescued_data IS NULL"
    action: warn
  - id: QR-02-05-07
    rule: "rows failing a drop rule are listed in failed_rules and routed to the quarantine"
    action: drop
  - id: SF-01
    rule: "NOT is_out_of_scope; out-of-period rows are left out of Silver and the quarantine and counted"
    action: drop
  - id: QR-09
    rule: "NOT is_duplicate; the loser (valid or dropped) is left out of Silver and the quarantine and counted; a dropped loser raises no per-rule total"
    action: drop
consumers:
  - name: metrics and reconciliation (src/smart_meter_peak_prediction/metrics.py)
    usage: rule, scope and duplicate totals, AC-11 reconciliation and AC-12 checks
  - name: smart_meter_dev.silver.meter_readings
    usage: rows with is_silver
  - name: smart_meter_dev.silver.meter_readings_quarantine
    usage: rows with is_quarantined (non-empty failed_rules and quarantine_rank = 1)
changes:
  policy: additive changes allowed; breaking changes need a new version and an ADR; not an interface to PEAK_MODEL
  version: 1
