# Daily PEAK_MODEL job (DESIGN, Bundle and job layout; ADR 0008). It refreshes the shared
# Silver/Gold pipeline, ingests the weather file, rebuilds the feature and label tables and scores
# the households eligible on the target date with the `champion` model. It has no training task:
# training is the separate on-demand job `smart_meter_peak_model_training` (D-36, D-37).
# Tasks run on serverless compute. No secret is needed (workspace identity only).
# The schedule is paused by development mode. Job parameters (FR-31) reach the notebooks as widgets
# of the same name (DA-14); values are strings and an empty `target_date` means the latest complete
# Gold day + 1.
resources:
  jobs:
    smart_meter_peak_model:
      name: smart_meter_peak_model
      max_concurrent_runs: 1
      timeout_seconds: 7200
      schedule:
        quartz_cron_expression: "0 0 8 * * ?"
        timezone_id: UTC
      email_notifications:
        on_failure:
          - ${workspace.current_user.userName}
      parameters:
        - name: label_threshold
          default: "1.3"
        - name: baseline_day_count
          default: "4"
        - name: label_lookback_weeks
          default: "8"
        - name: coverage_min
          default: "0.80"
        - name: zero_share_max
          default: "0.90"
        - name: eligibility_months
          default: "3"
        - name: target_date
          default: ""
        - name: target_date_end
          default: ""
      # Serverless environment version 2 (Python 3.11, scikit-learn 1.3.0 preinstalled) is the one
      # spike 05 validated (ADR 0007). Without it the jobs get a Python 3.12 environment where the
      # scikit-learn==1.3.0 pin has no wheel and %pip fails (PR 2 gate, build deviation D-19).
      environments:
        - environment_key: peak_model_env
          spec:
            environment_version: "2"
      tasks:
        # One retry after 10 minutes: an update that is already running (ingestion job) is refused
        # rather than queued (DA-13).
        - task_key: refresh_silver_gold
          timeout_seconds: 2700
          max_retries: 1
          min_retry_interval_millis: 600000
          pipeline_task:
            pipeline_id: ${resources.pipelines.smart_meter_silver_gold.id}
            full_refresh: false

        - task_key: ingest_weather
          timeout_seconds: 900
          max_retries: 1
          environment_key: peak_model_env
          notebook_task:
            notebook_path: ../notebooks/ingest_weather.py
            base_parameters:
              src_path: ${workspace.file_path}/src
              catalog: ${var.catalog}
              bronze_schema: ${var.bronze_schema}
              silver_schema: ${var.silver_schema}
              gold_schema: ${var.gold_schema}
              ml_schema: ${var.ml_schema}

        - task_key: build_weather_silver
          depends_on:
            - task_key: ingest_weather
          timeout_seconds: 900
          max_retries: 1
          environment_key: peak_model_env
          notebook_task:
            notebook_path: ../notebooks/build_weather_silver.py
            base_parameters:
              src_path: ${workspace.file_path}/src
              catalog: ${var.catalog}
              bronze_schema: ${var.bronze_schema}
              silver_schema: ${var.silver_schema}
              gold_schema: ${var.gold_schema}
              ml_schema: ${var.ml_schema}

        - task_key: build_features
          depends_on:
            - task_key: refresh_silver_gold
            - task_key: build_weather_silver
          timeout_seconds: 1800
          max_retries: 1
          environment_key: peak_model_env
          notebook_task:
            notebook_path: ../notebooks/build_features.py
            base_parameters:
              src_path: ${workspace.file_path}/src
              catalog: ${var.catalog}
              bronze_schema: ${var.bronze_schema}
              silver_schema: ${var.silver_schema}
              gold_schema: ${var.gold_schema}
              ml_schema: ${var.ml_schema}

        - task_key: build_labels
          depends_on:
            - task_key: refresh_silver_gold
          timeout_seconds: 1800
          max_retries: 1
          environment_key: peak_model_env
          notebook_task:
            notebook_path: ../notebooks/build_labels.py
            base_parameters:
              src_path: ${workspace.file_path}/src
              catalog: ${var.catalog}
              bronze_schema: ${var.bronze_schema}
              silver_schema: ${var.silver_schema}
              gold_schema: ${var.gold_schema}
              ml_schema: ${var.ml_schema}

        - task_key: score_predictions
          depends_on:
            - task_key: build_features
            - task_key: build_labels
          timeout_seconds: 1800
          max_retries: 1
          environment_key: peak_model_env
          notebook_task:
            notebook_path: ../notebooks/score_predictions.py
            base_parameters:
              src_path: ${workspace.file_path}/src
              catalog: ${var.catalog}
              bronze_schema: ${var.bronze_schema}
              silver_schema: ${var.silver_schema}
              gold_schema: ${var.gold_schema}
              ml_schema: ${var.ml_schema}
